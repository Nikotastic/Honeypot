[project]
name = "honeypot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "veasqueznikol10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.24.1",
]

[project.scripts]
honeypot = "honeypot:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]